<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code compiler</title>
</head>
<body>

    <textarea name="" id="code"></textarea>
    <button onclick="run()">run</button>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>

        const el = document.getElementById('code')
        function run(){
            axios.post('/exec',{code:el.value})
            .then((msg)=>{
                console.log(msg.data)
                console.log(msg.data.status)
                console.log("output: "+ msg.data.stdout)
                console.log("err: "+msg.data.stderr)
            })
            .catch((err)=>{
                console.log(err)
            })
        }
        


    </script>
</body>
</html>
