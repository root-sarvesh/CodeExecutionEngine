<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Code Compiler</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f8f9fa; }
        h2 { color: #333; }
        
        /* 2. Style the CodeMirror Container */
        .CodeMirror {
            height: 350px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
        select { padding: 8px; border-radius: 4px; margin-bottom: 20px; width: 200px; }
        
        #input { 
            width: 100%; 
            height: 80px; 
            font-family: monospace; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #218838; }

        .output-box { 
            background: #1e1e1e; 
            color: #dcdcdc; 
            padding: 15px; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            border: 1px solid #333; 
            margin-top: 10px;
            min-height: 50px;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .error { color: #ff5f56; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Secure Multi-Language Editor</h2>
    
    <label for="languageSelect">Select Language:</label>
    <select id="languageSelect">
        <option value="python">Python</option>
        <option value="text/x-c++src">C++</option>
        <option value="text/x-java">Java</option>
    </select>

    <label>Source Code:</label>
    <textarea id="code"># Write your Python code here
name = input("Enter your name: ")
print(f"Hello, {name}!")</textarea>

    <label>Custom Input (stdin):</label>
    <textarea id="input" placeholder="Enter input values here..."></textarea>

    <button onclick="run()">Run Code</button>

    <h3>Output:</h3>
    <div id="output" class="output-box">Waiting for execution...</div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script>
        // Initialize CodeMirror
        const editor = CodeMirror.fromTextArea(document.getElementById("code"), {
            lineNumbers: true,
            mode: "python",
            theme: "dracula",
            autoCloseBrackets: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true
        });

        const outputDiv = document.getElementById("output");
        const langSelect = document.getElementById("languageSelect");

        // Handle Language Change to update syntax highlighting
        langSelect.addEventListener("change", () => {
            const selectedMode = langSelect.value;
            editor.setOption("mode", selectedMode);
            
            // Optional: Provide a template when language changes
            if (selectedMode === "text/x-c++src") {
                editor.setValue("#include <iostream>\nusing namespace std;\n\nint main() {\n    string name;\n    cin >> name;\n    cout << \"Hello \" << name << endl;\n    return 0;\n}");
            } else if (selectedMode === "text/x-java") {
                editor.setValue("import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String s = sc.next();\n        System.out.println(\"Hello \" + s);\n    }\n}");
            } else {
                editor.setValue("name = input()\nprint(f\"Hello {name}\")");
            }
        });

        function run() {
            // Get data from CodeMirror using .getValue()
            const code = editor.getValue();
            const input = document.getElementById('input').value;
            
            // Map CodeMirror modes back to our backend names
            let language = "python";
            if (langSelect.value === "text/x-c++src") language = "cpp";
            if (langSelect.value === "text/x-java") language = "java";
            
            outputDiv.innerText = "Running...";
            outputDiv.style.color = "#dcdcdc";

            axios.post('/exec', { code, input, language })
            .then((res) => {
                const { status, stdout, stderr } = res.data;
                
                if (status === "SUCCESS") {
                    outputDiv.innerText = stdout || "Execution finished (no output).";
                } else {
                    outputDiv.innerHTML = `<span class="error">Status: ${status}</span>\n\n${stderr}\n${stdout}`;
                }
            })
            .catch((err) => {
                console.error(err);
                outputDiv.innerText = "Error: Could not connect to server.";
            });
        }
    </script>
</body>
</html>
